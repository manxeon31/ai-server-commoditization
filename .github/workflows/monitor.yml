name: AI Server Commoditization Monitor

on:
  schedule:
    # 13:17 UTC Saturday. Minute 17 avoids GitHub Actions' top-of-hour congestion.
    - cron: "17 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-server-commoditization-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Validate SEC user agent secret
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "SEC_USER_AGENT repository secret is missing."
            echo "Create it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check earnings cycle
        id: tracker
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m ai_server_tracker.main --github-output "$GITHUB_OUTPUT"

      - name: Commit tracker state/report
        if: steps.tracker.outputs.state_changed == 'true'
        run: |
          if git diff --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/history.json reports/
          git commit -m "chore: update AI server commoditization monitor"

          # The default branch may move while this workflow is running (for example,
          # when code/documentation is edited in parallel). Rebase the generated
          # state/report commit onto the latest remote main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Create issue for completed earnings cycle
        if: steps.tracker.outputs.report_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.tracker.outputs.report_path }}
          SCORE: ${{ steps.tracker.outputs.score }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          TITLE="AI server commoditization update — index ${SCORE}"
          if gh issue list --state all --search "in:title ${TITLE}" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Issue already exists: $TITLE"
            exit 0
          fi
          {
            echo "A complete new Dell/NVIDIA/HPE/Supermicro earnings cycle was detected."
            echo
            echo "**Commoditization Index:** ${SCORE}/100"
            echo
            echo "Report: [${REPORT_PATH}](${REPO_URL}/blob/main/${REPORT_PATH})"
          } > /tmp/issue-body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md

      - name: Send Telegram notification
        if: steps.tracker.outputs.report_created == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_PATH: ${{ steps.tracker.outputs.report_path }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are missing. Reuse TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID from your existing alert repos."
            exit 1
          fi
          python -m ai_server_tracker.telegram_notify \
            --report-url "${REPO_URL}/blob/main/${REPORT_PATH}"
